# Adam PreCare — staging (Mac mini 10.8.0.246). Dijalankan oleh deploy/staging/deploy.sh.
# Port host: web 3100 (3000 dipakai layanan lain), api 4000. DB/Redis tidak dibuka ke host.
# Domain (Cloudflare): web https://precare.adamlabs.dev → :3100, API https://api-precare.adamlabs.dev → :4000.
# mem_limit: staging dipakai bersama (VM Docker 8 GB, ±80 container lain).
name: adam-precare-staging

services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../infra/postgres/10_postgis.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    image: adam-precare/api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /repo/apps/api/uploads
    volumes:
      - uploads:/repo/apps/api/uploads
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: adam-precare/web:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL}/v1
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_PATH: /realtime
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "3100:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: {}
  redisdata: {}
  uploads: {}
