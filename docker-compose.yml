name: adam-precare

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: precare
      POSTGRES_PASSWORD: precare
      POSTGRES_DB: precare
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/10_postgis.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precare -d precare"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
